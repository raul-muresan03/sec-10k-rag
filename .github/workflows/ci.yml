name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            etl_pipeline/requirements.txt
            requirements-api.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r etl_pipeline/requirements.txt -r requirements-api.txt -r requirements-dev.txt
      - name: Run Python tests
        run: python -m pytest -q
      - name: Validate internal evaluation snapshot
        run: python -m scripts.export_demo --check
