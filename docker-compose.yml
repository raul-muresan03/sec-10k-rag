services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sec-rag-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - sec-rag-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: sec-rag-frontend
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - sec-rag-network

  ingestion:
    build:
      context: .
      dockerfile: etl_pipeline/Dockerfile
    container_name: sec-rag-ingestion
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
    networks:
      - sec-rag-network
    command: tail -f /dev/null 

networks:
  sec-rag-network:
    driver: bridge
